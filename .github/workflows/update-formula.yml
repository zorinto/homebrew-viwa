name: Update formula

# Points Formula/viwa.rb at a version of @zorinto/viwa on npm, only when the file npm serves has the sha256 given:
# the one viwa's Release workflow verified as the file it built. Started by viwa's release script. It never
# follows npm on its own, so a version that reached npm any other way does not reach Homebrew.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version on npm
        required: true
      sha256:
        description: The sha256 the Release run verified (VERIFIED_SHA256 in its log)
        required: true

permissions:
  contents: write

concurrency: update-formula

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update Formula/viwa.rb from npm
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          META=$(curl -fsSL "https://registry.npmjs.org/@zorinto%2Fviwa")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a version: $VERSION" >&2; exit 1; }
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]] || { echo "Not a sha256: $EXPECTED" >&2; exit 1; }
          URL=$(jq -r --arg v "$VERSION" '.versions[$v].dist.tarball // empty' <<<"$META")
          INTEGRITY=$(jq -r --arg v "$VERSION" '.versions[$v].dist.integrity // empty' <<<"$META")
          [ "$URL" = "https://registry.npmjs.org/@zorinto/viwa/-/viwa-$VERSION.tgz" ] || { echo "npm does not list $VERSION" >&2; exit 1; }
          for attempt in $(seq 1 40); do
            if curl -fsSL -o viwa.tgz "$URL"; then break; fi
            echo "Not served yet (attempt $attempt)"; sleep 15
          done
          [ -s viwa.tgz ] || { echo "$URL was not served in time" >&2; exit 1; }
          # The file must be the one npm recorded at publish (sha512), or the formula is left alone.
          [ "sha512-$(openssl dgst -sha512 -binary viwa.tgz | base64 -w0)" = "$INTEGRITY" ] || { echo "The tarball does not match npm's record of it" >&2; exit 1; }
          SHA256=$(sha256sum viwa.tgz | cut -d' ' -f1)
          [ "$SHA256" = "$EXPECTED" ] || { echo "npm serves $SHA256, not the verified $EXPECTED. The formula was not changed." >&2; exit 1; }
          sed -i -E \
            -e "s|/viwa-[0-9.]+\.tgz|/viwa-$VERSION.tgz|" \
            -e "s|sha256 \"[0-9a-f]+\"|sha256 \"$SHA256\"|" Formula/viwa.rb
          grep -q "viwa-$VERSION.tgz" Formula/viwa.rb && grep -q "$SHA256" Formula/viwa.rb
          if git diff --quiet; then echo "The formula is already at $VERSION."; exit 0; fi
          git -c user.name=Zorinto -c user.email=155092596+vimalhari@users.noreply.github.com \
            commit -qam "viwa $VERSION (prebuilt binary from npm)"
          git push origin HEAD:main
